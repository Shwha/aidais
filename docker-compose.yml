services:
  aidais:
    build: .
    ports:
      - "3001:3001"
      - "5173:5173"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5173
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
